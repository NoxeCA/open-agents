services:
  db:
    image: postgres:16
    container_name: quote-generator-db
    environment:
      POSTGRES_DB: quote_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - quote-generator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quote_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quote-generator-postgres-data:
